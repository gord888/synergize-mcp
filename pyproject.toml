[project]
name = "synergize-mcp"
version = "1.0.0"
description = "MCP server for Synergize SynWebService SOAP API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]
license = {text = "MIT"}
authors = [
    {name = "gord888"},
]
keywords = ["mcp", "synergize", "soap", "microdea"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
synergize-mcp = "synergize_mcp.server:main"

[project.urls]
Homepage = "https://github.com/gord888/synergize-mcp"
Repository = "https://github.com/gord888/synergize-mcp.git"
Issues = "https://github.com/gord888/synergize-mcp/issues"
Changelog = "https://github.com/gord888/synergize-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["ruff"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Catch real bugs (F = pyflakes) plus syntax-level pycodestyle errors (E).
# Line-length (E501) is intentionally ignored — wrapping the existing
# JSON-RPC response construction lines would hurt readability, not help.
select = ["E", "F"]
ignore = ["E501"]
